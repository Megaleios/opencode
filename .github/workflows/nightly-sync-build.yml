# =============================================================================
# Nightly Sync & Build
# - Sincroniza o fork com o upstream (anomalyco/opencode)
# - Builda a imagem Docker
# - Publica no GitHub Container Registry (ghcr.io)
# =============================================================================

name: Nightly Sync & Build

on:
  schedule:
    # Roda toda madrugada às 3:00 AM UTC (meia-noite horário de Brasília)
    - cron: '0 3 * * *'
  workflow_dispatch: # Permite rodar manualmente

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  sync-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      # 1. Checkout do fork
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # 2. Configurar Git
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # 3. Sync com upstream (anomalyco/opencode)
      - name: Sync from upstream
        id: sync
        run: |
          git remote add upstream https://github.com/anomalyco/opencode.git || true
          git fetch upstream dev

          # Tenta fazer merge do upstream/dev
          if git merge upstream/dev --no-edit; then
            echo "Merge successful"
            git push origin dev
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "Merge conflict detected - aborting merge"
            git merge --abort
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "::warning::Merge conflict with upstream. Manual intervention needed."
          fi

      # 4. Verificar se houve mudanças (ou se foi disparado manualmente)
      - name: Check for changes
        id: check
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_build=true" >> $GITHUB_OUTPUT
          elif [ "${{ steps.sync.outputs.changed }}" = "true" ]; then
            echo "should_build=true" >> $GITHUB_OUTPUT
          else
            echo "should_build=false" >> $GITHUB_OUTPUT
            echo "No changes detected, skipping build"
          fi

      # 5. Setup Docker Buildx
      - name: Set up Docker Buildx
        if: steps.check.outputs.should_build == 'true'
        uses: docker/setup-buildx-action@v3

      # 6. Login no GitHub Container Registry
      - name: Login to GHCR
        if: steps.check.outputs.should_build == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 7. Gerar tags e metadata
      - name: Docker metadata
        if: steps.check.outputs.should_build == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value={{date 'YYYYMMDD'}}
            type=sha,prefix=

      # 8. Build e Push da imagem
      - name: Build and push Docker image
        if: steps.check.outputs.should_build == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
